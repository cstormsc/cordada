{% extends "base.html" %}
{% load i18n %}
{% block content %}
<div class="narrow-wide">
  <p><a href="{% url 'plataforma:guia_index' %}">← {% translate "Guía de campo" %}</a></p>
  <h1>{% if item.pk %}{{ item }}{% else %}{% translate "Nuevo" %}{% endif %}</h1>
  <form method="post" class="form panel"{% if files %} enctype="multipart/form-data"{% endif %}>
    {% csrf_token %}
    {{ form }}
    <button type="submit" class="btn">{% translate "Guardar" %}</button>
  </form>
</div>
{% endblock %}
